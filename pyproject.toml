[project]
name = "writing-suite"
version = "1.0.0"
description = "Universal Academic Writing & SOTA Neural AI Detection Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "nltk>=3.10.3",
]

[project.optional-dependencies]
live = [
    "playwright>=1.40.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
